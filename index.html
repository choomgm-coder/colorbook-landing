<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ชุดสมุดระบายสีเด็ก 50 เล่ม</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f6f3ea;
      color:#333;
    }


.hero{
  background:#4a8fe8;
  color:#fff;
  text-align:center;
  padding:56px 20px 36px;
}

.hero .icon{
  font-size:42px;
  margin-bottom:10px;
}

.hero h1{
  margin:0;
  font-size:44px;
  font-weight:700;
}

.hero p{
  margin:16px auto 28px;
  max-width:760px;
  font-size:20px;
  line-height:1.6;
  opacity:.95;
}

.btn{
  display:inline-block;
  background:#39b86a;
  color:#fff;
  text-decoration:none;
  padding:18px 34px;
  border-radius:999px;
  font-size:24px;
  font-weight:700;
  box-shadow:0 6px 16px rgba(0,0,0,.12);
}

.container{
  max-width:1080px;
  margin:0 auto;
  padding:36px 20px 64px;
}

.price{
  text-align:center;
  font-size:30px;
  font-weight:700;
  color:#165c2f;
  line-height:1.8;
  margin-bottom:28px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:16px;
  color:#6d6d6d;
  margin:24px 0 24px;
  font-size:20px;
  justify-content:center;
}

.section-title::before,
.section-title::after{
  content:'';
  flex:1;
  max-width:180px;
  height:1px;
  background:#d8d1c2;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:24px;
}

.card{
  background:#fff;
  border:2px solid #ddd6c4;
  border-radius:22px;
  padding:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.card img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  border-radius:14px;
  display:block;
  background:#f1f1f1;
}

.card .num{
  margin-top:12px;
  color:#d65b4f;
  font-weight:700;
  font-size:16px;
}

.card .name{
  margin-top:4px;
  font-size:28px;
  font-weight:700;
  color:#2f2f2f;
}

.bottom{
  text-align:center;
  margin-top:42px;
}

@media (max-width:700px){
  .hero h1{font-size:34px}
  .hero p{font-size:18px}
  .btn{font-size:20px;width:100%;max-width:360px}
  .price{font-size:24px}
  .card .name{font-size:22px}
  .section-title::before,
  .section-title::after{max-width:80px}
}


  </style>
</head>
<body>

  <section class="hero">
    <div class="icon">🎨</div>
    <h1>ตัวอย่างสมุดระบายสีเด็ก</h1>
    <p>
      ครบ 50 เล่ม • ลายเส้นคมชัด • ระบายง่าย • เหมาะสำหรับเด็กเล็กและผู้ปกครอง
    </p>


<a class="btn" href="https://m.me/YOUR_PAGE" target="_blank">
  💬 ทักแชทสั่งซื้อเลย
</a>


  </section>

  <main class="container">

```
<div class="price">
  <div>159 บาท เลือกได้ 20 เล่ม (400 หน้า)</div>
  <div>199 บาท ได้ครบ 50 เล่ม (1,000 หน้า)</div>
</div>

<div class="section-title">ตัวอย่างลายเส้นทั้ง 50 เล่ม</div>

<section class="grid" id="samples-grid">
</section>

<script>
  const grid = document.getElementById("samples-grid");

  for (let i = 1; i <= 50; i++) {
    const num = String(i).padStart(2, "0");

    grid.innerHTML += `
      <article class="card">
        <img src="samples/colorbook/sample-${num}.jpg" alt="เล่ม ${num}">
        <div class="num">เล่ม ${num}</div>
        <div class="name">สมุดระบายสีเล่ม ${num}</div>
      </article>
    `;
  }

</section>

<div class="bottom">
  <a class="btn" href="https://m.me/YOUR_PAGE" target="_blank">
    💬 สั่งซื้อผ่าน Messenger
  </a>
</div>


  </main>

</body>
</html>
